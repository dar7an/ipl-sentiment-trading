[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ipl-sentiment-trading"
version = "1.0.0"
description = "Jev-orchestrated IPL 2024 paper book: typed decisions (choice/score/noul) drive sentiment, gating, and routing; deterministic math prices and settles; Gemma 4 narrates."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Darshan" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "nltk>=3.8",
  "google-genai>=1.0",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
ipl-analyze = "ipl_sentiment_trading.cli:main"
ipl-ui = "ipl_sentiment_trading.cli:ui_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# DTZ: the corpus is naive-local-IST by design (chunk timestamps carry no
# zone); timezone-awareness would add churn without changing semantics.
ignore = ["DTZ"]
# test fixture strings run long.
per-file-ignores = { "tests/test_sentiment.py" = ["E501"] }
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "ISC", "PYI", "BLE", "DTZ", "W"]
